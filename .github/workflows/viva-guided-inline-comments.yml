          }

          changed = []
          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              original = text
              for old, new in pairs.items():
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{file_name}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              if text != original:
                  path.write_text(text)
                  changed.append(file_name)

          print(f'Updated {len(changed)} source/style files')
          PY

      - name: Verify comment-only source changes
        shell: bash
        run: |
          rm .github/workflows/viva-guided-inline-comments.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git diff --check
          python - <<'PY'
          import subprocess
          diff = subprocess.check_output(['git','diff','--unified=0','origin/main...HEAD','--','backend/src','frontend/src'], text=True)
          # HEAD still equals main before commit, so also include working-tree diff.
          diff += subprocess.check_output(['git','diff','--unified=0','--','backend/src','frontend/src'], text=True)
          bad=[]
          for line in diff.splitlines():
              if line.startswith(('+++','---','@@','diff ','index ')):
                  continue
              if not line.startswith(('+','-')):
                  continue
              body=line[1:].lstrip()
              if not body:
                  continue
              if body.startswith(('//','/*','{/*','*','*/')):
                  continue
              bad.append(line)
          if bad:
              print('Non-comment source changes detected:')
              print('\n'.join(bad[:80]))
              raise SystemExit(1)
          print('Verified: all source changes are comments only.')
          PY

      - name: Install and verify frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm run test --workspace @career-learning-hub/web

      - name: Commit guided locator comments
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(viva): make inline feature comments self-locating'
          git push origin HEAD:task/viva-guided-inline-comments
