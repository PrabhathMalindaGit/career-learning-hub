name: Temporary Viva Inline Locator Finish

on:
  push:
    branches:
      - task/viva-inline-feature-locators

permissions:
  contents: write

jobs:
  apply-approved-inline-locators:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: task/viva-inline-feature-locators
          fetch-depth: 0

      - name: Apply precise comment-only locators
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/viva_finish_transform.py
          python /tmp/viva_finish_transform.py .

      - name: Verify source diff is additions-only comments
        shell: bash
        run: |
          git diff --check
          if git diff --numstat -- backend/src frontend/src | awk '$2 != 0 { bad=1 } END { exit bad }'; then
            echo 'Verified: this finishing pass has zero source deletions.'
          else
            echo 'Refusing: source deletion detected.' >&2
            exit 1
          fi
          python - <<'PY'
          import subprocess
          diff = subprocess.check_output([
              'git', 'diff', '--unified=0', '--', 'backend/src', 'frontend/src'
          ], text=True)
          bad = []
          for line in diff.splitlines():
              if not line.startswith('+') or line.startswith('+++'):
                  continue
              value = line[1:].lstrip()
              if value.startswith('//') or value.startswith('/*') or value.startswith('{/*'):
                  continue
              bad.append(line)
          if bad:
              print('Non-comment additions detected:')
              print('\n'.join(bad[:50]))
              raise SystemExit(1)
          print('Verified: every added source line in this pass is comment syntax.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit source comments and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/viva-inline-finish.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(viva): finish precise inline feature locators'
          git push origin HEAD:task/viva-inline-feature-locators
